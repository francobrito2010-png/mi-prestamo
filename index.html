<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy"

           script-src 'self' 'unsafe-inline' https://www.gstatic.com https://cdn.jsdelivr.net;
           style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
           font-src https://fonts.gstatic.com;
           img-src 'self' data: blob: https:;
           connect-src 'self' https://*.googleapis.com https://*.gstatic.com https://firebaseinstallations.googleapis.com https://identitytoolkit.googleapis.com https://securetoken.googleapis.com https://firestore.googleapis.com;
           frame-ancestors 'none'; base-uri 'self'; form-action 'self';">
<meta name="theme-color" content="#12785b">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Figtree:wght@400;500;600;700&display=swap">
<style>
  :root{
    --paper:#F4F6F2; --surface:#FFFFFF; --surface-2:#FBFCFA;
    --ink:#1B2621; --muted:#5E6B64; --faint:#8B968F;
    --line:#E3E7DF; --line-strong:#D3D9CE;
    --accent:#12785B; --accent-strong:#0E5F49; --accent-soft:#E4F1EB;
    --paid:#1F8A5B; --paid-soft:#E5F3EA;
    --due:#B24A2E; --due-soft:#F8E7E1;
    --soon:#B0791A; --soon-soft:#FAF0DB;
    --blue:#2C6E8F; --blue-soft:#E2EEF3;
    --shadow:0 1px 2px rgba(27,38,33,.05), 0 6px 20px rgba(27,38,33,.06);
    --shadow-lift:0 8px 30px rgba(27,38,33,.14);
    --radius:18px; --radius-sm:12px;
    --sans:"Figtree",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
    --serif:"Fraunces",Georgia,serif;
  }
  @media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
    --paper:#0F1512; --surface:#171E19; --surface-2:#141B16;
    --ink:#EBEFEA; --muted:#9DA89F; --faint:#718075;
    --line:#28322B; --line-strong:#39463C;
    --accent:#34BC8C; --accent-strong:#43CD9C; --accent-soft:#16271F;
    --paid:#42C489; --paid-soft:#15271D;
    --due:#E17A5C; --due-soft:#2C1C17;
    --soon:#E0AE4E; --soon-soft:#2A2313;
    --blue:#68B6D8; --blue-soft:#132630;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.32);
    --shadow-lift:0 10px 34px rgba(0,0,0,.5);
  }}
  :root[data-theme="dark"]{
    --paper:#0F1512; --surface:#171E19; --surface-2:#141B16;
    --ink:#EBEFEA; --muted:#9DA89F; --faint:#718075;
    --line:#28322B; --line-strong:#39463C;
    --accent:#34BC8C; --accent-strong:#43CD9C; --accent-soft:#16271F;
    --paid:#42C489; --paid-soft:#15271D;
    --due:#E17A5C; --due-soft:#2C1C17;
    --soon:#E0AE4E; --soon-soft:#2A2313;
    --blue:#68B6D8; --blue-soft:#132630;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.32);
    --shadow-lift:0 10px 34px rgba(0,0,0,.5);
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:var(--paper);color:var(--ink);font-family:var(--sans);line-height:1.5;
    -webkit-font-smoothing:antialiased;padding:0 16px calc(40px + env(safe-area-inset-bottom))}
  .wrap{max-width:600px;margin:0 auto}
  button{font-family:inherit;cursor:pointer}
  input,select,textarea{font-family:inherit}
  img{max-width:100%}
  [hidden]{display:none!important}

  header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:22px 2px 16px}
  .brand{display:flex;align-items:center;gap:11px;min-width:0}
  .mark{width:38px;height:38px;border-radius:11px;flex:none;background:linear-gradient(150deg,var(--accent),var(--accent-strong));
    display:grid;place-items:center;color:#fff;box-shadow:var(--shadow)}
  .mark svg{width:20px;height:20px}
  .brand h1{font-family:var(--serif);font-weight:600;font-size:19px;margin:0;letter-spacing:-.01em;line-height:1.1}
  .brand p{margin:0;font-size:12px;color:var(--faint);font-weight:500}
  .head-actions{display:flex;gap:8px}
  .icon-btn{width:40px;height:40px;border-radius:12px;flex:none;border:1px solid var(--line);background:var(--surface);
    color:var(--muted);display:grid;place-items:center;box-shadow:var(--shadow);transition:.15s}
  .icon-btn:hover{color:var(--ink);border-color:var(--line-strong)}
  .icon-btn svg{width:19px;height:19px}
  .backbtn{display:inline-flex;align-items:center;gap:6px;background:none;border:none;color:var(--muted);font-weight:600;font-size:14px;padding:6px 2px}
  .backbtn svg{width:18px;height:18px}

  /* grid of tiles */
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .tile{position:relative;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
    box-shadow:var(--shadow);padding:15px 15px 14px;min-height:126px;display:flex;flex-direction:column;gap:8px;transition:.15s;color:inherit}
  button.tile:hover{border-color:var(--line-strong);transform:translateY(-2px)}
  .tile .ic{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;font-size:19px;background:var(--surface-2);border:1px solid var(--line)}
  .tile .nm{font-weight:600;font-size:14.5px;line-height:1.2;letter-spacing:-.01em}
  .tile .big{font-family:var(--serif);font-weight:600;font-size:21px;letter-spacing:-.01em;font-variant-numeric:tabular-nums;margin-top:auto}
  .tile .sub{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
  .tile .chip{position:absolute;top:13px;right:13px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;padding:3px 8px;border-radius:99px}
  .chip.paid{background:var(--paid-soft);color:var(--paid)}
  .chip.due{background:var(--due-soft);color:var(--due)}
  .chip.soon{background:var(--soon-soft);color:var(--soon)}
  .chip.pend{background:var(--surface-2);color:var(--faint);border:1px solid var(--line)}
  .chip.shared{background:var(--blue-soft);color:var(--blue)}
  .tile.summary{background:linear-gradient(155deg,var(--accent),var(--accent-strong));color:#fff;border-color:transparent}
  .tile.summary .ic{background:rgba(255,255,255,.18);border-color:transparent;color:#fff}
  .tile.summary .sub{color:rgba(255,255,255,.85)}
  .tile.add{align-items:center;justify-content:center;text-align:center;color:var(--muted);border-style:dashed;background:var(--surface-2);gap:6px}
  .tile.add .plus{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);font-size:22px;font-weight:400}
  .tile.add .nm{font-weight:600;color:var(--ink)}
  .tile .foot-mini{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--faint);font-weight:600}
  .tile .foot-mini svg{width:13px;height:13px}

  /* box detail reuse */
  .hero{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:22px 20px 20px;margin-bottom:14px}
  .hero .who{font-size:13px;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:7px}
  .hero .who .dot{width:7px;height:7px;border-radius:50%;background:var(--accent)}
  .hero .label{text-transform:uppercase;letter-spacing:.09em;font-size:11px;color:var(--faint);font-weight:700;margin-top:16px}
  .balance{font-family:var(--serif);font-weight:600;letter-spacing:-.02em;font-size:clamp(36px,11vw,50px);line-height:1;margin:3px 0 2px;font-variant-numeric:tabular-nums}
  .balance.done{color:var(--paid)}
  .of-total{font-size:13.5px;color:var(--muted)} .of-total b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
  .track{height:10px;border-radius:99px;background:var(--surface-2);border:1px solid var(--line);overflow:hidden;margin:18px 0 8px;display:flex}
  .track i{display:block;background:linear-gradient(90deg,var(--accent),var(--accent-strong));transition:width .5s cubic-bezier(.2,.8,.2,1)}
  .prog-cap{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);font-weight:500} .prog-cap b{color:var(--ink)}
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:18px}
  .stat{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--radius-sm);padding:11px 12px}
  .stat .k{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--faint);font-weight:700}
  .stat .v{font-size:17px;font-weight:600;margin-top:3px;font-variant-numeric:tabular-nums;letter-spacing:-.01em} .stat .v small{font-size:12px;color:var(--muted);font-weight:500}

  .next{display:flex;align-items:center;gap:14px;background:linear-gradient(155deg,var(--accent),var(--accent-strong));color:#fff;border-radius:var(--radius);padding:16px 18px;margin-bottom:22px;box-shadow:var(--shadow)}
  .next.allpaid{background:var(--paid-soft);color:var(--ink);border:1px solid color-mix(in srgb,var(--paid) 30%,transparent)}
  .next .ico{width:42px;height:42px;border-radius:12px;flex:none;display:grid;place-items:center;background:rgba(255,255,255,.18)}
  .next.allpaid .ico{background:var(--surface);color:var(--paid)} .next .ico svg{width:22px;height:22px}
  .next .txt{min-width:0} .next .txt .t1{font-size:12px;opacity:.85;font-weight:600;text-transform:uppercase;letter-spacing:.05em}
  .next.allpaid .txt .t1{opacity:1;color:var(--paid)}
  .next .txt .t2{font-family:var(--serif);font-weight:600;font-size:20px;line-height:1.15;margin-top:2px;font-variant-numeric:tabular-nums}
  .next .txt .t3{font-size:12.5px;opacity:.9;margin-top:1px}
  .next .go{margin-left:auto;flex:none;background:#fff;color:var(--accent-strong);border:none;border-radius:11px;padding:11px 15px;font-weight:700;font-size:13.5px;box-shadow:0 2px 8px rgba(0,0,0,.15)}

  .section-h{display:flex;align-items:baseline;justify-content:space-between;margin:0 4px 11px}
  .section-h h2{font-family:var(--serif);font-weight:600;font-size:17px;margin:0;letter-spacing:-.01em}
  .section-h span{font-size:12.5px;color:var(--faint);font-weight:500}
  .ledger{display:flex;flex-direction:column;gap:9px}
  .row{display:flex;align-items:center;gap:13px;text-align:left;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;box-shadow:var(--shadow);transition:.15s;color:inherit}
  button.row:hover{border-color:var(--line-strong);transform:translateY(-1px)}
  .row .num{width:40px;height:40px;border-radius:11px;flex:none;display:grid;place-items:center;font-weight:700;font-size:13px;font-variant-numeric:tabular-nums;background:var(--surface-2);color:var(--muted);border:1px solid var(--line);text-align:center;line-height:1.05}
  .row.s-paid .num{background:var(--paid-soft);color:var(--paid);border-color:transparent}
  .row.s-due .num{background:var(--due-soft);color:var(--due);border-color:transparent}
  .row.s-soon .num{background:var(--accent-soft);color:var(--accent);border-color:transparent}
  .row .mid{flex:1;min-width:0} .row .mid .l1{font-weight:600;font-size:14.5px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .row .mid .l2{font-size:12.5px;color:var(--muted);margin-top:1px;font-variant-numeric:tabular-nums}
  .pill{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;padding:2px 8px;border-radius:99px;white-space:nowrap}
  .pill.paid{background:var(--paid-soft);color:var(--paid)} .pill.due{background:var(--due-soft);color:var(--due)}
  .pill.soon{background:var(--accent-soft);color:var(--accent)} .pill.pend{background:var(--surface-2);color:var(--faint);border:1px solid var(--line)}
  .row .amt{text-align:right;flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
  .row .amt .a{font-weight:700;font-size:14.5px;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
  .row .amt .thumb{width:34px;height:34px;border-radius:8px;object-fit:cover;border:1px solid var(--line)}
  .row .amt .chev{color:var(--faint)} .row .amt .chev svg{width:18px;height:18px}

  .sumcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:6px 18px;margin-bottom:14px}
  .sumrow{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:13px 0;border-bottom:1px solid var(--line)}
  .sumrow:last-child{border-bottom:none}
  .sumrow .nm{display:flex;align-items:center;gap:10px;font-size:14.5px;font-weight:500;min-width:0}
  .sumrow .nm .e{font-size:18px} .sumrow .nm .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .sumrow .val{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
  .sumtotal{display:flex;justify-content:space-between;align-items:baseline;padding:16px 18px;background:linear-gradient(155deg,var(--accent),var(--accent-strong));color:#fff;border-radius:var(--radius);margin-bottom:14px;box-shadow:var(--shadow)}
  .sumtotal .k{font-size:12px;text-transform:uppercase;letter-spacing:.06em;font-weight:700;opacity:.9}
  .sumtotal .v{font-family:var(--serif);font-weight:600;font-size:30px;font-variant-numeric:tabular-nums}

  .foot{display:flex;flex-direction:column;gap:10px;margin-top:22px}
  .foot button{display:flex;align-items:center;justify-content:center;gap:9px;background:var(--surface);border:1px solid var(--line);color:var(--ink);border-radius:14px;padding:14px;font-weight:600;font-size:14px;box-shadow:var(--shadow);transition:.15s}
  .foot button:hover{border-color:var(--line-strong)} .foot button svg{width:18px;height:18px;color:var(--muted)}
  .foot .primary{background:var(--accent);border-color:transparent;color:#fff} .foot .primary svg{color:#fff}
  .credit{text-align:center;color:var(--faint);font-size:11.5px;margin-top:20px;line-height:1.7}
  .credit .sync{display:inline-flex;align-items:center;gap:6px} .credit .sync .d{width:7px;height:7px;border-radius:50%;background:var(--paid)} .credit .sync.off .d{background:var(--due)}

  .scrim{position:fixed;inset:0;background:rgba(15,21,18,.55);backdrop-filter:blur(3px);display:flex;align-items:flex-end;justify-content:center;z-index:50;opacity:0;transition:opacity .2s}
  .scrim.open{opacity:1} @media(min-width:560px){.scrim{align-items:center;padding:20px}}
  .sheet{background:var(--surface);width:100%;max-width:560px;border-radius:22px 22px 0 0;box-shadow:var(--shadow-lift);max-height:92vh;overflow-y:auto;transform:translateY(20px);transition:transform .25s cubic-bezier(.2,.8,.2,1);padding:8px 20px calc(24px + env(safe-area-inset-bottom))}
  @media(min-width:560px){.sheet{border-radius:22px}} .scrim.open .sheet{transform:translateY(0)}
  .grip{width:40px;height:4px;border-radius:99px;background:var(--line-strong);margin:8px auto 4px}
  .sheet h3{font-family:var(--serif);font-weight:600;font-size:21px;margin:10px 2px 4px;letter-spacing:-.01em}
  .sheet .sub{font-size:13px;color:var(--muted);margin:0 2px 18px}
  .field{margin-bottom:15px} .field label{display:block;font-size:12.5px;font-weight:600;color:var(--muted);margin-bottom:6px;padding-left:2px}
  .field input,.field select,.field textarea{width:100%;border:1px solid var(--line-strong);background:var(--surface-2);color:var(--ink);border-radius:12px;padding:12px 13px;font-size:16px;transition:.15s}
  .field textarea{resize:vertical;min-height:60px;font-size:15px}
  .field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  .field .hint{font-size:11.5px;color:var(--faint);margin-top:5px;padding-left:2px}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .prefix{position:relative} .prefix span.cur{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--faint);font-size:15px;font-weight:600;pointer-events:none} .prefix input{padding-left:30px}
  .emojipick{display:flex;gap:7px;flex-wrap:wrap;margin-top:2px}
  .emojipick button{width:42px;height:42px;border-radius:11px;border:1px solid var(--line-strong);background:var(--surface-2);font-size:20px;display:grid;place-items:center}
  .emojipick button.sel{border-color:var(--accent);background:var(--accent-soft);box-shadow:0 0 0 2px var(--accent-soft)}
  .typecard{display:flex;gap:12px;align-items:center;width:100%;text-align:left;border:1px solid var(--line-strong);background:var(--surface-2);border-radius:14px;padding:15px;margin-bottom:10px}
  .typecard:hover{border-color:var(--accent)} .typecard .e{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-size:22px;flex:none}
  .typecard.pr .e{background:var(--blue-soft);color:var(--blue)} .typecard.ga .e{background:var(--accent-soft);color:var(--accent)}
  .typecard .tt{font-weight:600;font-size:15px} .typecard .ts{font-size:12.5px;color:var(--muted)}
  .drop{border:1.5px dashed var(--line-strong);border-radius:14px;padding:20px;text-align:center;background:var(--surface-2);color:var(--muted);transition:.15s;display:block}
  .drop:hover{border-color:var(--accent);color:var(--accent)} .drop svg{width:26px;height:26px;margin-bottom:6px} .drop .big{font-weight:600;font-size:14px;color:var(--ink)} .drop .small{font-size:12px;margin-top:2px}
  .preview{position:relative;border-radius:14px;overflow:hidden;border:1px solid var(--line)} .preview img{display:block;width:100%;max-height:260px;object-fit:contain;background:var(--surface-2)}
  .preview .rm{position:absolute;top:8px;right:8px;background:rgba(15,21,18,.7);color:#fff;border:none;width:32px;height:32px;border-radius:50%;display:grid;place-items:center} .preview .rm svg{width:16px;height:16px}
  .btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;border:none;border-radius:13px;padding:15px;font-weight:700;font-size:15.5px;transition:.15s}
  .btn.primary{background:var(--accent);color:#fff} .btn.primary:hover{background:var(--accent-strong)}
  .btn.ghost{background:transparent;color:var(--muted);padding:12px} .btn.soft{background:var(--surface-2);border:1px solid var(--line);color:var(--ink)} .btn.danger{background:var(--due-soft);color:var(--due)}
  .btn:disabled{opacity:.5;cursor:default}
  .sheet-actions{display:flex;flex-direction:column;gap:8px;margin-top:8px}
  .kv{display:flex;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);font-size:14px} .kv:last-child{border-bottom:none} .kv .k{color:var(--muted)} .kv .v{font-weight:600;font-variant-numeric:tabular-nums;text-align:right}
  .memberrow{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px} .memberrow .em{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .memberrow .tag{font-size:10.5px;font-weight:700;text-transform:uppercase;color:var(--accent);background:var(--accent-soft);padding:2px 7px;border-radius:99px} .memberrow button{background:none;border:none;color:var(--due);font-weight:600;font-size:13px}
  .err{background:var(--due-soft);color:var(--due);border-radius:10px;padding:10px 12px;font-size:13px;font-weight:500;margin-bottom:12px}
  .ok{background:var(--accent-soft);color:var(--accent);border-radius:10px;padding:10px 12px;font-size:13px;font-weight:500;margin-bottom:12px}

  .viewer{position:fixed;inset:0;background:rgba(10,14,12,.92);z-index:60;display:none;align-items:center;justify-content:center;padding:20px;flex-direction:column;gap:16px} .viewer.open{display:flex}
  .viewer img{max-width:100%;max-height:80vh;border-radius:12px;box-shadow:var(--shadow-lift)} .viewer button{background:rgba(255,255,255,.14);color:#fff;border:none;border-radius:11px;padding:11px 18px;font-weight:600}

  .center-screen{min-height:88vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:8px;padding:20px 0}
  .login-card{background:var(--surface);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);padding:28px 22px;width:100%;max-width:400px;text-align:left}
  .login-card .lead{text-align:center;margin-bottom:22px} .login-card .biglogo{width:56px;height:56px;border-radius:16px;margin:0 auto 12px;background:linear-gradient(150deg,var(--accent),var(--accent-strong));display:grid;place-items:center;color:#fff;box-shadow:var(--shadow)} .login-card .biglogo svg{width:28px;height:28px}

<script>
const firebaseConfig = {
  apiKey: "AIzaSyDBZIwltVQSB5fBCJOZIqxmljA9OGdukjk",
  authDomain: "mi-prestamo-c839b.firebaseapp.com",

/* ---------- helpers ---------- */
const FREQ={mensual:{label:"Mensual",add:(d,n)=>addMonths(d,n)},quincenal:{label:"Quincenal",add:(d,n)=>addDays(d,n*15)},semanal:{label:"Semanal",add:(d,n)=>addDays(d,n*7)}};
const CURRENCIES={EUR:"€",USD:"$",BRL:"R$",GBP:"£",MXN:"$",COP:"$",ARS:"$"};
const ICONS_GASTO=["🏠","💡","💧","📶","📺","📱","🚌","🛒","🚗","💳","🏥","🎬","☕","💰"];
const ICONS_PREST=["🤝","💸","👤","📄","🏦"];
function addDays(d,n){const x=new Date(d);x.setDate(x.getDate()+n);return x;}
function addMonths(d,n){const x=new Date(d);const day=x.getDate();x.setDate(1);x.setMonth(x.getMonth()+n);x.setDate(Math.min(day,daysInMonth(x)));return x;}
function daysInMonth(d){return new Date(d.getFullYear(),d.getMonth()+1,0).getDate();}
function todayISO(){return isoOf(new Date());}
function isoOf(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
function parseISO(s){if(!s)return null;const p=String(s).split("-");return new Date(+p[0],+p[1]-1,+p[2]);}
function monthKey(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0");}
function curMonthKey(){return monthKey(new Date());}
function parseMonth(k){const p=String(k).split("-");return new Date(+p[0],+p[1]-1,1);}
function monthLabel(k){const d=parseMonth(k);return d.toLocaleDateString("es-ES",{month:"long",year:"numeric"});}
function fmtDate(iso){const d=parseISO(iso);if(!d||isNaN(d))return"—";return d.toLocaleDateString("es-ES",{day:"numeric",month:"short",year:"numeric"});}
function fmtDateShort(iso){const d=parseISO(iso);if(!d||isNaN(d))return"—";return d.toLocaleDateString("es-ES",{day:"numeric",month:"short"});}
function money(n,cur){cur=cur||"EUR";try{return new Intl.NumberFormat("es-ES",{style:"currency",currency:cur,maximumFractionDigits:2}).format(n||0);}catch(e){return (CURRENCIES[cur]||"")+(n||0).toFixed(2);}}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function clean(s){try{return DOMPurify.sanitize(String(s==null?"":s),{ALLOWED_TAGS:[],ALLOWED_ATTR:[]}).trim();}catch(e){return String(s==null?"":s).replace(/[<>]/g,"").trim();}}
function el(html){const t=document.createElement("template");t.innerHTML=html.trim();return t.content.firstElementChild;}
async function sha256(s){const b=new TextEncoder().encode(s);const h=await crypto.subtle.digest("SHA-256",b);return Array.from(new Uint8Array(h)).map(x=>x.toString(16).padStart(2,"0")).join("");}
function validEmail(e){return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e);}
function genId(){return "b"+Date.now().toString(36)+Math.random().toString(36).slice(2,7);}

/* ---------- state ---------- */
let fb={auth:null,db:null};
let me={user:null,email:null,uid:null};
let userDoc=null; // {adminHash}
let boxes={};      // id -> data
let entries={};    // boxId -> {entryId:data}
let entryUnsub={}; // boxId -> unsub
let subs=[]; let adminUnlocked=false; let syncPending=false;
let bioEnabled=false, bioUnlocked=false;
let view={name:"home"}; let migrationTried=false;

/* ---------- boot ---------- */
window.addEventListener("DOMContentLoaded",()=>{
  document.getElementById("viewerClose").addEventListener("click",()=>document.getElementById("viewer").classList.remove("open"));
  document.getElementById("viewer").addEventListener("click",e=>{if(e.target.id==="viewer")e.currentTarget.classList.remove("open");});
  try{const t=localStorage.getItem("mp_theme");if(t)document.documentElement.setAttribute("data-theme",t);}catch(e){}
  if("serviceWorker" in navigator){navigator.serviceWorker.register("sw.js").catch(function(){});}
  if(!firebaseConfig||firebaseConfig.apiKey==="PEGA_AQUI"){renderConfigMissing();return;}
  try{firebase.initializeApp(firebaseConfig);fb.auth=firebase.auth();fb.db=firebase.firestore();fb.db.enablePersistence({synchronizeTabs:true}).catch(()=>{});}
  catch(e){renderConfigMissing(e.message);return;}
  renderLoading("Conectando…");
  try{ bioEnabled = localStorage.getItem("mp_bio")==="1" && !!localStorage.getItem("mp_bio_cred"); }catch(e){ bioEnabled=false; }
  fb.auth.setPersistence(bioEnabled?firebase.auth.Auth.Persistence.LOCAL:firebase.auth.Auth.Persistence.SESSION).catch(function(){}).then(function(){
  fb.auth.onAuthStateChanged(u=>{
    stopSubs(); boxes={};entries={};userDoc=null;adminUnlocked=false;migrationTried=false;view={name:"home"};
    me.user=u; me.email=u?(u.email||"").toLowerCase():null; me.uid=u?u.uid:null;
    if(u){ if(bioEnabled && !bioUnlocked){ renderBioLock(); } else { startSubs(); } } else { renderLogin(); }
  });
  });
  window.addEventListener("online",render); window.addEventListener("offline",render);
});
function stopSubs(){subs.forEach(u=>{try{u();}catch(e){}});subs=[];Object.values(entryUnsub).forEach(u=>{try{u();}catch(e){}});entryUnsub={};}

/* ---------- subscriptions ---------- */
function startSubs(){
  renderLoading("Cargando tus cuadros…");
  subs.push(fb.db.doc("users/"+me.uid).onSnapshot(s=>{userDoc=s.exists?s.data():null;render();},()=>{}));
  subs.push(fb.db.collection("boxes").where("members","array-contains",me.email).onSnapshot(s=>{
    const seen={};
    s.forEach(d=>{seen[d.id]=true; boxes[d.id]=Object.assign({id:d.id},d.data());
      if(!entryUnsub[d.id]) subscribeEntries(d.id);
      if(s.metadata) syncPending=s.metadata.hasPendingWrites;});
    Object.keys(boxes).forEach(id=>{if(!seen[id]){delete boxes[id];if(entryUnsub[id]){try{entryUnsub[id]();}catch(e){}delete entryUnsub[id];}delete entries[id];}});
    maybeMigrate();
    render();
  },err=>{render();}));
}
function subscribeEntries(boxId){
  entryUnsub[boxId]=fb.db.collection("boxes/"+boxId+"/entries").onSnapshot(s=>{
    const m={};s.forEach(d=>m[d.id]=d.data());entries[boxId]=m;
    if(s.metadata) syncPending=s.metadata.hasPendingWrites; render();
  },()=>{});
}

/* ---------- migration from legacy loan ---------- */
async function maybeMigrate(){
  if(migrationTried) return; migrationTried=true;
  try{
    const acc=await fb.db.doc("meta/access").get();
    if(!acc.exists) return;
    const a=acc.data();
    if(a.migratedToBox) return;
    if((String(a.owner||"").toLowerCase())!==me.email) return; // only owner migrates
    const cfgSnap=await fb.db.doc("loan/config").get();
    if(!cfgSnap.exists){ await fb.db.doc("meta/access").update({migratedToBox:"none"}); return; }
    const c=cfgSnap.data();
    const boxId=genId();
    const boxDoc={
      name: c.borrowerName? ("Préstamo: "+c.borrowerName) : "Préstamo",
      type:"prestamo", icon:"🤝",
      ownerUid:me.uid, ownerEmail:me.email,
      members:(a.members||[]).map(x=>String(x).toLowerCase()),
      currency:c.currency||"EUR", numInstallments:c.numInstallments||6, installmentAmount:c.installmentAmount||0,
      principal:c.principal||0, startDate:c.startDate||todayISO(), frequency:c.frequency||"mensual",
      note:c.note||"", order:0, createdAt:Date.now(), updatedAt:Date.now()
    };
    if(!boxDoc.members.includes(me.email)) boxDoc.members.unshift(me.email);
    await fb.db.doc("boxes/"+boxId).set(boxDoc);
    const pays=await fb.db.collection("payments").get();
    for(const p of pays.docs){ try{ await fb.db.doc("boxes/"+boxId+"/entries/"+p.id).set(p.data()); }catch(e){} }
    if(a.adminHash){ await fb.db.doc("users/"+me.uid).set({adminHash:a.adminHash},{merge:true}); }
    await fb.db.doc("meta/access").update({migratedToBox:boxId});
  }catch(e){ /* migration best-effort */ }
}

/* ---------- derive per box ---------- */
function boxEntries(boxId){return entries[boxId]||{};}
function derivePrestamo(b){
  const n=Math.max(1,Math.min(120,parseInt(b.numInstallments)||1)), per=+b.installmentAmount||0, total=n*per;
  const es=boxEntries(b.id); const rows=[]; let paidCount=0,paidSum=0,firstUnpaid=-1; const today=parseISO(todayISO());
  for(let i=1;i<=n;i++){const id="c"+i;const pay=es[id];const due=b.startDate?FREQ[b.frequency||"mensual"].add(parseISO(b.startDate),i-1):null;
    let st; if(pay){st="paid";paidCount++;paidSum+=(+pay.amount||0);} else if(due&&due<today){st="due";} else st="pending";
    if(!pay&&firstUnpaid<0)firstUnpaid=i; rows.push({i,id,pay,due:due?isoOf(due):null,status:st,per});}
  if(firstUnpaid>0){const r=rows[firstUnpaid-1];if(r.status==="pending")r.status="soon";r.isNext=true;}
  return {rows,n,per,total,paidCount,paidSum,remaining:Math.max(0,total-paidSum),nextRow:firstUnpaid>0?rows[firstUnpaid-1]:null,dueCount:rows.filter(r=>r.status==="due").length};
}
function deriveGasto(b){
  const es=boxEntries(b.id); const per=+b.amount||0; const startK=b.startMonth||curMonthKey(); const nowK=curMonthKey();
  const rows=[]; let d=parseMonth(nowK); const startD=parseMonth(startK); let guard=0; const today=new Date();
  while(d>=startD && guard<36){const k=monthKey(d);const pay=es[k];let st;
    if(pay)st="paid"; else if(k===nowK){ st=(b.dueDay && today.getDate()>(+b.dueDay))?"due":"soon"; } else st="due"; // past unpaid months are overdue
    rows.push({k,id:k,pay,status:st,per}); d=addMonths(d,-1);guard++;}
  const cur=rows.find(r=>r.k===nowK); const paidThis=cur&&cur.status==="paid";
  const paidCount=rows.filter(r=>r.pay).length;
  return {rows,per,curKey:nowK,curStatus:cur?cur.status:"soon",paidThis,paidCount,dueCount:rows.filter(r=>r.status==="due").length};
}
function boxIsOwner(b){return b.ownerUid===me.uid;}

/* ---------- screens ---------- */
function renderConfigMissing(msg){document.getElementById("root").innerHTML=`<div class="center-screen"><div class="login-card"><div class="lead"><div class="biglogo">${logoSvg()}</div><h2>Falta configurar</h2><p class="tag">No se ha pegado la configuración de Firebase.</p></div><div class="err">${esc(msg||"")}</div></div></div>`;}
function renderLoading(t){document.getElementById("root").innerHTML=`<div class="center-screen"><div class="loading"><div class="spinner"></div><div>${esc(t||"Cargando…")}</div></div></div>`;document.getElementById("credit").innerHTML="";}
function logoSvg(){return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="14" rx="2.5"/><path d="M3 10h18M7 15h4"/></svg>`;}

let loginMode="in";
function renderLogin(){
  document.getElementById("credit").innerHTML="";
  const root=document.getElementById("root");root.innerHTML="";
  const card=el(`<div class="center-screen"><div class="login-card">
    <div class="lead"><div class="biglogo">${logoSvg()}</div><h2>Mi Control</h2><p class="tag">Tus cuentas, seguras y en tiempo real</p></div>
    <div id="loginErr"></div>
    <div class="field"><label>Correo</label><input type="email" id="lgEmail" autocomplete="username" placeholder="tucorreo@ejemplo.com"></div>
    <div class="field"><label>Contraseña</label><input type="password" id="lgPass" autocomplete="current-password" placeholder="••••••••"></div>
    <div class="sheet-actions"><button class="btn primary" id="lgGo">${loginMode==="in"?"Entrar":"Crear cuenta"}</button></div>
    <div class="switch-line" id="lgSwitch"></div>
    <div class="switch-line"><button class="linkbtn" id="lgForgot">Olvidé mi contraseña</button></div>
  </div></div>`);
  root.appendChild(card);
  card.querySelector("#lgSwitch").innerHTML=loginMode==="in"?`¿Primera vez? <button class="linkbtn" id="lgToUp">Crear una cuenta</button>`:`¿Ya tienes cuenta? <button class="linkbtn" id="lgToIn">Entrar</button>`;
  const tu=card.querySelector("#lgToUp");if(tu)tu.addEventListener("click",()=>{loginMode="up";renderLogin();});
  const ti=card.querySelector("#lgToIn");if(ti)ti.addEventListener("click",()=>{loginMode="in";renderLogin();});
  card.querySelector("#lgGo").addEventListener("click",async()=>{
    const email=clean(card.querySelector("#lgEmail").value).toLowerCase();const pass=card.querySelector("#lgPass").value;const eb=card.querySelector("#loginErr");eb.innerHTML="";
    if(!validEmail(email)){eb.innerHTML=`<div class="err">Escribe un correo válido.</div>`;return;}
    if((pass||"").length<6){eb.innerHTML=`<div class="err">La contraseña debe tener al menos 6 caracteres.</div>`;return;}
    const btn=card.querySelector("#lgGo");btn.disabled=true;btn.textContent="Un momento…";
    bioUnlocked=true; // probó identidad con contraseña: no volver a pedir Face ID en esta apertura
    try{ if(loginMode==="in")await fb.auth.signInWithEmailAndPassword(email,pass); else await fb.auth.createUserWithEmailAndPassword(email,pass); }
    catch(e){btn.disabled=false;btn.textContent=loginMode==="in"?"Entrar":"Crear cuenta";eb.innerHTML=`<div class="err">${esc(authErr(e))}</div>`;}
  });
  card.querySelector("#lgForgot").addEventListener("click",async()=>{const email=clean(card.querySelector("#lgEmail").value).toLowerCase();const eb=card.querySelector("#loginErr");
    if(!validEmail(email)){eb.innerHTML=`<div class="err">Escribe tu correo arriba y vuelve a tocar aquí.</div>`;return;}
    try{await fb.auth.sendPasswordResetEmail(email);eb.innerHTML=`<div class="ok">Te enviamos un correo para restablecer la contraseña.</div>`;}catch(e){eb.innerHTML=`<div class="err">${esc(authErr(e))}</div>`;}});
}
function authErr(e){const c=e&&e.code||"";
  if(c.includes("invalid-credential")||c.includes("wrong-password")||c.includes("user-not-found"))return "Correo o contraseña incorrectos.";
  if(c.includes("email-already-in-use"))return "Ese correo ya tiene cuenta. Toca «Entrar».";
  if(c.includes("weak-password"))return "Contraseña muy débil (mínimo 6).";
  if(c.includes("too-many-requests"))return "Demasiados intentos. Espera un momento.";
  if(c.includes("network"))return "Sin conexión. Revisa tu internet.";
  if(c.includes("operation-not-allowed"))return "Falta activar «Correo/contraseña» en Firebase.";
  return "No se pudo. Inténtalo de nuevo.";}

/* ---------- main render ---------- */
function render(){
  if(!me.user) return;
  if(view.name==="box"){ if(!boxes[view.boxId]){view={name:"home"};} else { renderBox(view.boxId); return; } }
  if(view.name==="summary"){ renderSummary(); return; }
  renderHome();
}
function creditLine(){
  const off=!navigator.onLine||syncPending;
  document.getElementById("credit").innerHTML=`<span class="sync ${off?'off':''}"><span class="d"></span>${off?'Guardando… se sincroniza al reconectar':'Sincronizado en tiempo real'}</span><br>Sesión: ${esc(me.email||"")} · <a href="#" id="logoutLink" style="color:var(--accent)">Salir</a>`;
  const l=document.getElementById("logoutLink");if(l)l.addEventListener("click",e=>{e.preventDefault();fb.auth.signOut();});
}

function renderHome(){
  const root=document.getElementById("root");root.innerHTML="";
  root.appendChild(el(`<header><div class="brand"><div class="mark">${logoSvg()}</div><div><h1>Mi Control</h1><p>Tus cuentas</p></div></div>
    <div class="head-actions">
      <button class="icon-btn" id="themeBtn" title="Tema"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></button>
      <button class="icon-btn" id="menuBtn" title="Menú"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="5" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="12" cy="19" r="1.6"/></svg></button>
    </div></header>`));

  const list=Object.values(boxes).sort((a,b)=>(a.order||0)-(b.order||0)||(a.createdAt||0)-(b.createdAt||0));
  const grid=el(`<div class="grid"></div>`);

  // summary tile (only if there is at least one box)
  if(list.length>0){
    const st=el(`<button class="tile summary" id="tileSummary"><div class="ic">📊</div><div class="nm">Resumen</div><div class="big">Ver totales</div><div class="sub">gastos y saldos</div></button>`);
    grid.appendChild(st);
  }

  list.forEach(b=>{
    const shared=(b.members||[]).length>1;
    let icon=b.icon||(b.type==="prestamo"?"🤝":"💳");
    let big="",sub="",chip="";
    if(b.type==="prestamo"){const d=derivePrestamo(b);
      big=money(d.remaining,b.currency); sub=`${d.paidCount}/${d.n} cuotas`;
      if(d.remaining<=0&&d.total>0)chip=`<span class="chip paid">Saldado</span>`; else if(d.dueCount>0)chip=`<span class="chip due">${d.dueCount} vencida${d.dueCount>1?'s':''}</span>`;
    }else{const d=deriveGasto(b);
      big=money(d.per,b.currency); sub="al mes";
      if(d.curStatus==="paid")chip=`<span class="chip paid">Pagado</span>`; else if(d.curStatus==="due")chip=`<span class="chip due">Vencido</span>`; else chip=`<span class="chip soon">Este mes</span>`;
    }
    const t=el(`<button class="tile" data-box="${b.id}">${chip}<div class="ic">${icon}</div>
      <div class="nm">${esc(b.name||"Sin nombre")}</div>
      <div class="big">${big}</div><div class="sub">${sub}</div>
      ${shared?`<div class="foot-mini"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg>Compartido</div>`:``}</button>`);
    grid.appendChild(t);
  });

  grid.appendChild(el(`<button class="tile add" id="tileAdd"><div class="plus">+</div><div class="nm">Añadir cuadro</div></button>`));
  root.appendChild(grid);

  if(list.length===0){ root.appendChild(el(`<p class="empty" style="margin-top:18px">Aún no tienes cuadros. Toca <b>Añadir cuadro</b> para empezar: un préstamo o un gasto mensual (alquiler, luz, Netflix…).</p>`)); }

  root.querySelectorAll("[data-box]").forEach(b=>b.addEventListener("click",()=>{view={name:"box",boxId:b.getAttribute("data-box")};render();}));
  const ts=root.querySelector("#tileSummary");if(ts)ts.addEventListener("click",()=>{view={name:"summary"};render();});
  root.querySelector("#tileAdd").addEventListener("click",openNewBoxChooser);
  root.querySelector("#themeBtn").addEventListener("click",toggleTheme);
  root.querySelector("#menuBtn").addEventListener("click",openMenu);
  creditLine();
}

function renderSummary(){
  const root=document.getElementById("root");root.innerHTML="";
  root.appendChild(topBar("Resumen"));
  const list=Object.values(boxes);
  const gastos=list.filter(b=>b.type==="gasto");
  const prestamos=list.filter(b=>b.type==="prestamo");
  // group by currency for the monthly total (usually one currency)
  const byCur={};
  gastos.forEach(b=>{const c=b.currency||"EUR";byCur[c]=(byCur[c]||0)+(+b.amount||0);});
  const totalStr=Object.keys(byCur).length?Object.keys(byCur).map(c=>money(byCur[c],c)).join(" + "):money(0);

  root.appendChild(el(`<div class="sumtotal"><div><div class="k">Gasto mensual fijo</div></div><div class="v">${totalStr}</div></div>`));

  if(gastos.length){
    root.appendChild(el(`<div class="section-h"><h2>Gastos mensuales</h2><span>${gastos.length}</span></div>`));
    const card=el(`<div class="sumcard"></div>`);
    gastos.forEach(b=>{const d=deriveGasto(b);
      card.appendChild(el(`<div class="sumrow"><div class="nm"><span class="e">${b.icon||"💳"}</span><span class="t">${esc(b.name||"")}</span></div>
        <div class="val">${money(b.amount,b.currency)} <span style="color:var(--muted);font-weight:500;font-size:12px">/mes ${d.curStatus==="paid"?"✅":d.curStatus==="due"?"⚠️":"·"}</span></div></div>`));
    });
    root.appendChild(card);
  }

  if(prestamos.length){
    root.appendChild(el(`<div class="section-h"><h2>Préstamos</h2><span>por cobrar</span></div>`));
    const card=el(`<div class="sumcard"></div>`);
    prestamos.forEach(b=>{const d=derivePrestamo(b);
      card.appendChild(el(`<div class="sumrow"><div class="nm"><span class="e">${b.icon||"🤝"}</span><span class="t">${esc(b.name||"")}</span></div>
        <div class="val">${money(d.remaining,b.currency)} <span style="color:var(--muted);font-weight:500;font-size:12px">pendiente</span></div></div>`));
    });
    root.appendChild(card);
  }

  if(!gastos.length&&!prestamos.length) root.appendChild(el(`<p class="empty">Nada que resumir todavía.</p>`));
  creditLine();
}

function wireEntries(root,b,owner){
  root.querySelectorAll("[data-pay]").forEach(btn=>btn.addEventListener("click",e=>{e.stopPropagation();openEntry(b,btn.getAttribute("data-pay"),owner);}));
  root.querySelectorAll("[data-zoom]").forEach(img=>img.addEventListener("click",e=>{e.stopPropagation();const v=document.getElementById("viewer");document.getElementById("viewerImg").src=img.src;v.classList.add("open");}));
}

function confirmDeleteEntry(b,entryId){

function openEntryForm(b,entryId,existing){
  let receipt=existing?(existing.receipt||""):"";
  const isPr=b.type==="prestamo";
  const sheet=el(`<div class="sheet"><div class="grip"></div><h3>${esc(entryTitle(b,entryId))}</h3><p class="sub">${existing?"Corregir el pago":(isPr?"Registrar el pago de esta cuota":"Registrar el pago de este mes")}</p>
    <div class="two"><div class="field"><label>Fecha del pago</label><input type="date" id="pDate" value="${existing?existing.dateISO:todayISO()}"></div>
    <div class="field"><label>Monto pagado</label><div class="prefix"><span class="cur">${CURRENCIES[b.currency||"EUR"]||""}</span><input type="number" inputmode="decimal" id="pAmount" step="0.01" value="${existing?existing.amount:(isPr?(b.installmentAmount||""):(b.amount||""))}"></div></div></div>
    <div class="field"><label>Nota (opcional)</label><input type="text" id="pNote" maxlength="120" placeholder="Ej: pagó en efectivo" value="${existing?esc(existing.note||''):''}"></div>
    <div class="field"><label>Comprobante</label><div id="recSlot"></div><div class="hint">Foto o captura del recibo, transferencia, etc.</div></div>
    <div class="sheet-actions"><button class="btn primary" id="pSave">${existing?"Guardar cambios":"Marcar como pagado"}</button><button class="btn ghost" id="pCancel">Cancelar</button></div></div>`);
  const scrim=openModal(sheet);const recSlot=sheet.querySelector("#recSlot");
  function rr(){recSlot.innerHTML="";if(receipt){const pv=el(`<div class="preview"><img src="${receipt}" alt="c"><button class="rm"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg></button></div>`);pv.querySelector(".rm").addEventListener("click",()=>{receipt="";rr();});recSlot.appendChild(pv);}
    else{const lab=el(`<label class="drop"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3.2"/></svg><div class="big">Añadir foto</div><div class="small">Toca para tomar o elegir</div><input type="file" accept="image/*" style="display:none" id="recFile"></label>`);
      lab.querySelector("#recFile").addEventListener("change",async e=>{const f=e.target.files[0];if(!f)return;lab.querySelector(".big").textContent="Procesando…";try{receipt=await resizeImage(f);}catch(err){alert("No se pudo cargar la imagen.");}rr();});recSlot.appendChild(lab);}}
  rr();
  sheet.querySelector("#pCancel").addEventListener("click",()=>scrim._close());
  sheet.querySelector("#pSave").addEventListener("click",async()=>{
    const amount=parseFloat(sheet.querySelector("#pAmount").value)||0;const dateISO=sheet.querySelector("#pDate").value||todayISO();const note=clean(sheet.querySelector("#pNote").value).slice(0,120);
    const pay={amount,dateISO,note,receipt,createdAt:existing?(existing.createdAt||Date.now()):Date.now(),updatedAt:Date.now(),by:me.email};
    if(isPr)pay.n=parseInt(entryId.slice(1)); else pay.month=entryId;
    scrim._close();
    try{await fb.db.doc("boxes/"+b.id+"/entries/"+entryId).set(pay);}catch(e){alert("No se pudo guardar: "+(e.message||e));}
  });
}

/* ---------- image ---------- */
function resizeImage(file){return new Promise((res,rej)=>{const rd=new FileReader();rd.onerror=rej;rd.onload=()=>{const img=new Image();img.onerror=rej;img.onload=()=>{const MAX=1100;let{width:w,height:h}=img;if(w>MAX||h>MAX){const s=Math.min(MAX/w,MAX/h);w=Math.round(w*s);h=Math.round(h*s);}const cv=document.createElement("canvas");cv.width=w;cv.height=h;cv.getContext("2d").drawImage(img,0,0,w,h);let q=0.72,out=cv.toDataURL("image/jpeg",q);while(out.length>180000&&q>0.35){q-=0.1;out=cv.toDataURL("image/jpeg",q);}res(out);};img.src=rd.result;};rd.readAsDataURL(file);});}

    <div class="sheet-actions"><button class="btn primary" id="fSave">${isNew?"Crear cuadro":"Guardar"}</button>${!isNew?`<button class="btn danger" id="fDelete">Eliminar este cuadro</button>`:``}<button class="btn ghost" id="fCancel">Cancelar</button></div></div>`);
  const scrim=openModal(sheet);

  sheet.querySelectorAll("#fIcons button").forEach(x=>x.addEventListener("click",()=>{icon=x.getAttribute("data-e");sheet.querySelectorAll("#fIcons button").forEach(y=>y.classList.remove("sel"));x.classList.add("sel");}));
  const cs=sheet.querySelector("#fCur");cs.addEventListener("change",()=>{const s=sheet.querySelector("#curSym");if(s)s.textContent=CURRENCIES[cs.value]||"";});
  let editing=null;
  function paintMembers(){
    const ownerEmail=(box?String(box.ownerEmail||me.email).toLowerCase():me.email);
    const cont=sheet.querySelector("#memberList");cont.innerHTML="";
    if(!pendingMembers.length){cont.innerHTML='<p class="empty">Solo tú.</p>';return;}
    pendingMembers.forEach(m=>{const o=(ownerEmail===m);
      if(editing===m&&!o){
        cont.appendChild(el(`<div class="memberrow"><input type="email" value="${esc(m)}" style="flex:1;min-width:0;border:1px solid var(--line-strong);background:var(--surface-2);color:var(--ink);border-radius:9px;padding:9px 10px;font-size:15px"><button data-save="${esc(m)}" style="color:var(--accent)">Guardar</button><button data-cancel="1" style="color:var(--muted)">Cancelar</button></div>`));
      }else{
        cont.appendChild(el(`<div class="memberrow"><span class="em">${esc(m)}</span>${o?'<span class="tag">Tú</span>':`<button data-edit="${esc(m)}" style="color:var(--accent)">Editar</button><button data-remove="${esc(m)}">Quitar</button>`}</div>`));
      }});
    cont.querySelectorAll("[data-edit]").forEach(btn=>btn.addEventListener("click",()=>{editing=btn.getAttribute("data-edit");paintMembers();}));
    cont.querySelectorAll("[data-cancel]").forEach(btn=>btn.addEventListener("click",()=>{editing=null;paintMembers();}));
    cont.querySelectorAll("[data-remove]").forEach(btn=>btn.addEventListener("click",()=>{pendingMembers=pendingMembers.filter(x=>x!==btn.getAttribute("data-remove"));editing=null;paintMembers();}));
    cont.querySelectorAll("[data-save]").forEach(btn=>btn.addEventListener("click",()=>{
      const oldm=btn.getAttribute("data-save");const inp=btn.parentElement.querySelector("input");const nv=clean(inp.value).toLowerCase();const eb=sheet.querySelector("#fErr");eb.innerHTML="";
      if(!validEmail(nv)){eb.innerHTML='<div class="err">Correo no válido.</div>';return;}
      const i=pendingMembers.indexOf(oldm);
      if(i>=0){ if(nv!==oldm&&pendingMembers.includes(nv)){pendingMembers.splice(i,1);} else {pendingMembers[i]=nv;} }
      editing=null;paintMembers();}));
  }
  paintMembers();
  sheet.querySelector("#fAddMember").addEventListener("click",()=>{const nm=clean(sheet.querySelector("#fNewMember").value).toLowerCase();const eb=sheet.querySelector("#fErr");eb.innerHTML="";
    if(!validEmail(nm)){eb.innerHTML=`<div class="err">Correo no válido.</div>`;return;}if(!pendingMembers.includes(nm))pendingMembers.push(nm);sheet.querySelector("#fNewMember").value="";paintMembers();});
  sheet.querySelector("#fCancel").addEventListener("click",()=>scrim._close());
  const del=sheet.querySelector("#fDelete");if(del)del.addEventListener("click",()=>{scrim._close();confirmDeleteBox(box);});

  sheet.querySelector("#fSave").addEventListener("click",async()=>{
    const eb=sheet.querySelector("#fErr");eb.innerHTML="";
    const name=clean(sheet.querySelector("#fName").value).slice(0,40);
    if(!name){eb.innerHTML=`<div class="err">Ponle un nombre.</div>`;return;}
    const currency=sheet.querySelector("#fCur").value;
    const doc={name,type,icon,currency,ownerUid:(box?box.ownerUid:me.uid),ownerEmail:(box?box.ownerEmail:me.email),updatedAt:Date.now()};
    if(type==="prestamo"){doc.numInstallments=Math.max(1,Math.min(120,parseInt(sheet.querySelector("#fNum").value)||1));doc.installmentAmount=parseFloat(sheet.querySelector("#fAmt").value)||0;doc.frequency=sheet.querySelector("#fFreq").value;doc.startDate=sheet.querySelector("#fStart").value||todayISO();doc.principal=box?box.principal||0:0;
      if(doc.installmentAmount<=0){eb.innerHTML=`<div class="err">Pon el valor de la cuota.</div>`;return;}}
    else{doc.amount=parseFloat(sheet.querySelector("#fAmt").value)||0;const dd=parseInt(sheet.querySelector("#fDue").value);doc.dueDay=dd>=1&&dd<=28?dd:0;doc.startMonth=sheet.querySelector("#fStartM").value||curMonthKey();
      if(doc.amount<=0){eb.innerHTML=`<div class="err">Pon el monto mensual.</div>`;return;}}
    // members
    const ownerEmail=(box?String(box.ownerEmail||me.email).toLowerCase():me.email);
    if(!pendingMembers.includes(ownerEmail))pendingMembers.unshift(ownerEmail);
    doc.members=pendingMembers;
    // admin code
    if(needCode){const c1=sheet.querySelector("#fCode1").value,c2=sheet.querySelector("#fCode2").value;
      if(c1.length<4){eb.innerHTML=`<div class="err">El código debe tener al menos 4 dígitos.</div>`;return;}
      if(c1!==c2){eb.innerHTML=`<div class="err">Los códigos no coinciden.</div>`;return;}
      try{await fb.db.doc("users/"+me.uid).set({adminHash:await sha256(c1)},{merge:true});adminUnlocked=true;}catch(e){eb.innerHTML=`<div class="err">No se pudo guardar el código.</div>`;return;}}
    const btn=sheet.querySelector("#fSave");btn.disabled=true;btn.textContent="Guardando…";
    try{
      const id=box?box.id:genId();
      if(isNew){doc.createdAt=Date.now();doc.order=Object.keys(boxes).length;}
      await fb.db.doc("boxes/"+id).set(doc,{merge:true});
      scrim._close();
      if(isNew){view={name:"box",boxId:id};render();}
    }catch(e){btn.disabled=false;btn.textContent=isNew?"Crear cuadro":"Guardar";eb.innerHTML=`<div class="err">No se pudo guardar: ${esc(e.message||e)}</div>`;}
  });
}
function confirmDeleteBox(box){
  const sheet=el(`<div class="sheet"><div class="grip"></div><h3>Eliminar cuadro</h3><p class="sub">Se borrará "${esc(box.name)}" y sus registros. Esto no se puede deshacer.</p>
    <div class="sheet-actions"><button class="btn danger" id="dOk">Sí, eliminar el cuadro</button><button class="btn ghost" id="dNo">Cancelar</button></div></div>`);
  const scrim=openModal(sheet);sheet.querySelector("#dNo").addEventListener("click",()=>scrim._close());
  sheet.querySelector("#dOk").addEventListener("click",()=>{scrim._close();requireAdmin(async()=>{
    try{const es=await fb.db.collection("boxes/"+box.id+"/entries").get();for(const d of es.docs){try{await fb.db.doc("boxes/"+box.id+"/entries/"+d.id).delete();}catch(e){}}
      await fb.db.doc("boxes/"+box.id).delete();view={name:"home"};render();}catch(e){alert("No se pudo eliminar: "+(e.message||e));}});});
}

/* ---------- admin gate ---------- */
function requireAdmin(cb){
  if(adminUnlocked){cb();return;}
  if(!userDoc||!userDoc.adminHash){cb();return;} // no code set yet
  const sheet=el(`<div class="sheet"><div class="grip"></div><h3>Código de administrador</h3><p class="sub">Introdúcelo para editar o borrar.</p>
    <div id="adErr"></div><div class="field"><label>Código</label><input type="password" id="adCode" inputmode="numeric" autocomplete="off" placeholder="••••"></div>
    <div class="sheet-actions"><button class="btn primary" id="adOk">Desbloquear</button><button class="btn ghost" id="adCancel">Cancelar</button></div></div>`);
  const scrim=openModal(sheet);
  const go=async()=>{const h=await sha256(sheet.querySelector("#adCode").value);if(h===userDoc.adminHash){adminUnlocked=true;scrim._close();cb();}else sheet.querySelector("#adErr").innerHTML=`<div class="err">Código incorrecto.</div>`;};
  sheet.querySelector("#adOk").addEventListener("click",go);sheet.querySelector("#adCode").addEventListener("keydown",e=>{if(e.key==="Enter")go();});
  sheet.querySelector("#adCancel").addEventListener("click",()=>scrim._close());setTimeout(()=>sheet.querySelector("#adCode").focus(),120);
}

/* ---------- menu ---------- */
function openMenu(){
  const sheet=el(`<div class="sheet"><div class="grip"></div><h3>Menú</h3><p class="sub">${esc(me.email||"")}</p>
    <div class="sheet-actions">
      <button class="btn soft" id="mBio">${bioEnabled?"🔓 Desactivar Face ID / huella":"🙂 Entrar con Face ID / huella"}</button>
      <button class="btn soft" id="mChangeCode">${userDoc&&userDoc.adminHash?"Cambiar código de administrador":"Crear código de administrador"}</button>
      ${adminUnlocked?`<button class="btn soft" id="mLock">🔒 Bloquear administrador</button>`:``}
      <button class="btn danger" id="mOut">Cerrar sesión</button><button class="btn ghost" id="mClose">Cerrar</button></div></div>`);
  const scrim=openModal(sheet);sheet.querySelector("#mClose").addEventListener("click",()=>scrim._close());
  sheet.querySelector("#mOut").addEventListener("click",()=>fb.auth.signOut());
  const ml=sheet.querySelector("#mLock");if(ml)ml.addEventListener("click",()=>{adminUnlocked=false;scrim._close();render();});
  sheet.querySelector("#mChangeCode").addEventListener("click",()=>{scrim._close();requireAdmin(openChangeCode);});
  sheet.querySelector("#mBio").addEventListener("click",async()=>{
    if(bioEnabled){ disableBio(); bioEnabled=false; scrim._close(); alert("Face ID / huella desactivado. La próxima vez se pedirá correo y contraseña."); }
    else{ const ok=await enableBio(); if(ok){ bioEnabled=true; scrim._close(); alert("¡Listo! La próxima vez que abras la app, entrarás con Face ID / huella."); } }
  });
}
function openChangeCode(){
  const sheet=el(`<div class="sheet"><div class="grip"></div><h3>Código de administrador</h3><p class="sub">Elige un código (mín. 4 dígitos).</p>
    <div id="ccErr"></div><div class="two"><div class="field"><label>Código</label><input type="password" id="cc1" inputmode="numeric" autocomplete="off"></div><div class="field"><label>Repetir</label><input type="password" id="cc2" inputmode="numeric" autocomplete="off"></div></div>
    <div class="sheet-actions"><button class="btn primary" id="ccOk">Guardar</button><button class="btn ghost" id="ccNo">Cancelar</button></div></div>`);
  const scrim=openModal(sheet);sheet.querySelector("#ccNo").addEventListener("click",()=>scrim._close());
  sheet.querySelector("#ccOk").addEventListener("click",async()=>{const c1=sheet.querySelector("#cc1").value,c2=sheet.querySelector("#cc2").value;const eb=sheet.querySelector("#ccErr");
    if(c1.length<4){eb.innerHTML=`<div class="err">Mínimo 4 dígitos.</div>`;return;}if(c1!==c2){eb.innerHTML=`<div class="err">No coinciden.</div>`;return;}
    try{await fb.db.doc("users/"+me.uid).set({adminHash:await sha256(c1)},{merge:true});adminUnlocked=true;scrim._close();}catch(e){eb.innerHTML=`<div class="err">No se pudo guardar.</div>`;}});
}

/* ---------- share ---------- */
function openShare(b){
  const lines=[]; lines.push((b.type==="prestamo"?"📋 PRÉSTAMO":"📋 GASTO")+": "+(b.name||""));lines.push("");
  if(b.type==="prestamo"){const d=derivePrestamo(b);lines.push("Total: "+money(d.total,b.currency));lines.push("Pagado: "+money(d.paidSum,b.currency)+" ("+d.paidCount+"/"+d.n+")");lines.push("Pendiente: "+money(d.remaining,b.currency));lines.push("");
    d.rows.forEach(r=>{const m=r.status==="paid"?"✅":(r.status==="due"?"⚠️":"⬜");lines.push(`${m} Cuota ${r.i} · ${money(r.per,b.currency)} · ${r.pay?("pagada "+fmtDateShort(r.pay.dateISO)):(r.due?("vence "+fmtDateShort(r.due)):"")}`);});}
  else{const d=deriveGasto(b);lines.push("Al mes: "+money(d.per,b.currency));lines.push("Meses pagados: "+d.paidCount);lines.push("");
    d.rows.slice(0,12).forEach(r=>{const m=r.status==="paid"?"✅":(r.status==="due"?"⚠️":"🟡");lines.push(`${m} ${monthLabel(r.k)} · ${r.pay?("pagado "+fmtDateShort(r.pay.dateISO)):"sin pagar"}`);});}
  const text=lines.join("\n");
  const sheet=el(`<div class="sheet"><div class="grip"></div><h3>Compartir resumen</h3><p class="sub">Envíalo por WhatsApp o guárdalo.</p>
    <div class="field"><textarea id="shTxt" style="min-height:200px;font-family:ui-monospace,monospace;font-size:13px" readonly>${esc(text)}</textarea></div>
    <div class="sheet-actions"><button class="btn primary" id="shSend">Compartir</button><button class="btn soft" id="shCopy">Copiar</button><button class="btn soft" id="shPrint">Imprimir / PDF</button><button class="btn ghost" id="shCancel">Cerrar</button></div></div>`);
  const scrim=openModal(sheet);sheet.querySelector("#shCancel").addEventListener("click",()=>scrim._close());
  sheet.querySelector("#shSend").addEventListener("click",async()=>{if(navigator.share){try{await navigator.share({title:b.name||"Resumen",text});}catch(e){}}else copyText(text,sheet.querySelector("#shSend"));});
  sheet.querySelector("#shCopy").addEventListener("click",()=>copyText(text,sheet.querySelector("#shCopy")));
  sheet.querySelector("#shPrint").addEventListener("click",()=>{scrim._close();setTimeout(()=>window.print(),200);});
}
function copyText(t,btn){const done=()=>{const o=btn.textContent;btn.textContent="¡Copiado!";setTimeout(()=>btn.textContent=o,1400);};if(navigator.clipboard)navigator.clipboard.writeText(t).then(done).catch(()=>fc(t,done));else fc(t,done);}
function fc(t,done){const ta=document.createElement("textarea");ta.value=t;document.body.appendChild(ta);ta.select();try{document.execCommand("copy");done();}catch(e){}ta.remove();}

/* ---------- modal + theme ---------- */
function openModal(node){const root=document.getElementById("modalRoot");const scrim=el(`<div class="scrim"></div>`);scrim.appendChild(node);root.appendChild(scrim);requestAnimationFrame(()=>scrim.classList.add("open"));scrim.addEventListener("click",e=>{if(e.target===scrim)closeModal(scrim);});scrim._close=()=>closeModal(scrim);return scrim;}
function closeModal(s){s.classList.remove("open");setTimeout(()=>s.remove(),220);}
function toggleTheme(){const r=document.documentElement,c=r.getAttribute("data-theme");const sd=window.matchMedia("(prefers-color-scheme:dark)").matches;let n;if(!c)n=sd?"light":"dark";else n=c==="dark"?"light":"dark";r.setAttribute("data-theme",n);try{localStorage.setItem("mp_theme",n);}catch(e){}}

/* ---------- Face ID / huella (WebAuthn) ---------- */
function b64e(buf){let s="";const a=new Uint8Array(buf);for(let i=0;i<a.length;i++)s+=String.fromCharCode(a[i]);return btoa(s);}
function b64d(str){const bin=atob(str);const a=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i);return a.buffer;}
async function bioAvailable(){try{return !!(window.PublicKeyCredential)&&await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable();}catch(e){return false;}}
async function enableBio(){
  if(!(await bioAvailable())){alert("Este teléfono/navegador no permite Face ID o huella aquí. En iPhone usa Safari.");return false;}
  try{
    const challenge=crypto.getRandomValues(new Uint8Array(32));
    const uid=crypto.getRandomValues(new Uint8Array(16));
    const cred=await navigator.credentials.create({publicKey:{
      challenge, rp:{name:"Mi Control", id:location.hostname},
      user:{id:uid, name:me.email||"usuario", displayName:me.email||"usuario"},
      pubKeyCredParams:[{type:"public-key",alg:-7},{type:"public-key",alg:-257}],
      authenticatorSelection:{authenticatorAttachment:"platform", userVerification:"required", residentKey:"preferred"},
      timeout:60000, attestation:"none"
    }});
    if(!cred||!cred.rawId) throw new Error("sin credencial");
    localStorage.setItem("mp_bio","1");
    localStorage.setItem("mp_bio_cred", b64e(cred.rawId));
    localStorage.setItem("mp_bio_email", me.email||"");
    await fb.auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL).catch(()=>{});
    bioUnlocked=true;
    return true;
  }catch(e){ alert("No se pudo activar: "+(e.message||e)); return false; }
}
function disableBio(){try{localStorage.removeItem("mp_bio");localStorage.removeItem("mp_bio_cred");localStorage.removeItem("mp_bio_email");}catch(e){}fb.auth.setPersistence(firebase.auth.Auth.Persistence.SESSION).catch(()=>{});}
async function bioUnlock(){
  try{
    const credId=localStorage.getItem("mp_bio_cred"); if(!credId) return false;
    const challenge=crypto.getRandomValues(new Uint8Array(32));
    const assertion=await navigator.credentials.get({publicKey:{
      challenge, timeout:60000, rpId:location.hostname,
      allowCredentials:[{type:"public-key", id:b64d(credId), transports:["internal"]}],
      userVerification:"required"
    }});
    if(assertion){ bioUnlocked=true; startSubs(); return true; }
  }catch(e){}
  return false;
}
function renderBioLock(){
  const root=document.getElementById("root");
  root.innerHTML=`<div class="center-screen"><div class="login-card">
    <div class="lead"><div class="biglogo">${logoSvg()}</div><h2>Mi Control</h2><p class="tag">Desbloquea para continuar</p></div>
    <div id="bioErr"></div>
    <div class="sheet-actions">
      <button class="btn primary" id="bioBtn">🙂 Desbloquear con Face ID / huella</button>
      <button class="btn ghost" id="bioPass">Usar correo y contraseña</button>
    </div></div></div>`;
  document.getElementById("credit").innerHTML="";
  document.getElementById("bioBtn").addEventListener("click",async()=>{
    const ok=await bioUnlock();
    if(!ok) document.getElementById("bioErr").innerHTML=`<div class="err">No se pudo desbloquear. Intenta otra vez o usa tu contraseña.</div>`;
  });
  document.getElementById("bioPass").addEventListener("click",()=>{ bioUnlocked=true; fb.auth.signOut(); });
  // intento automático de desbloqueo (algunos navegadores lo permiten sin tocar el botón)
  setTimeout(()=>{ bioUnlock().then(ok=>{ if(!ok){/* esperar toque del usuario */} }); }, 300);
}
